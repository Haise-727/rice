exec = hyprctl dispatch submap global
submap = global

# Modifier Definitions
$mainMod = ALT
$superMod = SUPER


# ## Shell keybinds
# Launcher
bindr = Super, Super_L, exec, pkill fuzzel || fuzzel

# Misc
bind = $kbSession, exec, wlogout
bindl = $superMod, N, exec, makoctl dismiss --all
#bind = $superMod, P, global, caelestia:showall
bind = $superMod, M, exec, swaylock -f

# Restore lock
bindl = $kbRestoreLock, exec, pkill -x waybar; waybar & disown
bindl = $kbRestoreLock, exec, swaylock -f

# Brightness
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media
bindl = Shift+Super, Space, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = Shift+Super, Period, exec, playerctl next
bindl = , XF86AudioNext, exec, playerctl next
bindl = Shift+Super, Comma, exec, playerctl previous
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# Kill/restart
#bindr = Ctrl+Super+Shift, R, exec, qs -c caelestia kill
bindr = Super+Shift, R, exec, pkill -x waybar; waybar & disown

# Go to workspace #
$wsaction = ~/.config/hypr/scripts/wsaction.fish
bind = $mainMod, 1, exec, $wsaction workspace 1
bind = $mainMod, 2, exec, $wsaction workspace 2
bind = $mainMod, 3, exec, $wsaction workspace 3
bind = $mainMod, 4, exec, $wsaction workspace 4
bind = $mainMod, 5, exec, $wsaction workspace 5
bind = $mainMod, 6, exec, $wsaction workspace 6
bind = $mainMod, 7, exec, $wsaction workspace 7
bind = $mainMod, 8, exec, $wsaction workspace 8
bind = $mainMod, 9, exec, $wsaction workspace 9
bind = $mainMod, 0, exec, $wsaction workspace 10

bind = $superMod, 1, exec, $wsaction workspace 1
bind = $superMod, 2, exec, $wsaction workspace 2
bind = $superMod, 3, exec, $wsaction workspace 3
bind = $superMod, 4, exec, $wsaction workspace 4
bind = $superMod, 5, exec, $wsaction workspace 5
bind = $superMod, 6, exec, $wsaction workspace 6
bind = $superMod, 7, exec, $wsaction workspace 7
bind = $superMod, 8, exec, $wsaction workspace 8
bind = $superMod, 9, exec, $wsaction workspace 9
bind = $superMod, 0, exec, $wsaction workspace 10

# Go to workspace group #
#bind = $kbGoToWsGroup, 1, exec, $wsaction -g workspace 1
#bind = $kbGoToWsGroup, 2, exec, $wsaction -g workspace 2
#bind = $kbGoToWsGroup, 3, exec, $wsaction -g workspace 3
#bind = $kbGoToWsGroup, 4, exec, $wsaction -g workspace 4
#bind = $kbGoToWsGroup, 5, exec, $wsaction -g workspace 5
#bind = $kbGoToWsGroup, 6, exec, $wsaction -g workspace 6
#bind = $kbGoToWsGroup, 7, exec, $wsaction -g workspace 7
#bind = $kbGoToWsGroup, 8, exec, $wsaction -g workspace 8
#bind = $kbGoToWsGroup, 9, exec, $wsaction -g workspace 9
#bind = $kbGoToWsGroup, 0, exec, $wsaction -g workspace 10

# Go to workspace -1/+1
bind = Super, mouse_down, workspace, -1
bind = Super, mouse_up, workspace, +1
#binde = $kbPrevWs, workspace, -1
#binde = $kbNextWs, workspace, +1
#binde = Super, Page_Up, workspace, -1
#binde = Super, Page_Down, workspace, +1

# Go to workspace group -1/+1
#bind = Ctrl+Super, mouse_down, workspace, -10
#bind = Ctrl+Super, mouse_up, workspace, +10

# Toggle special workspace
#bind = $Super, O, exec, caelestia toggle specialws

# Move window to workspace #
bind = Super SHIFT, 1, exec, $wsaction movetoworkspace 1
bind = Super SHIFT, 2, exec, $wsaction movetoworkspace 2
bind = Super SHIFT, 3, exec, $wsaction movetoworkspace 3
bind = Super SHIFT, 4, exec, $wsaction movetoworkspace 4
bind = Super SHIFT, 5, exec, $wsaction movetoworkspace 5
bind = Super SHIFT, 6, exec, $wsaction movetoworkspace 6
bind = Super SHIFT, 7, exec, $wsaction movetoworkspace 7
bind = Super SHIFT, 8, exec, $wsaction movetoworkspace 8
bind = Super SHIFT, 9, exec, $wsaction movetoworkspace 9
bind = Super SHIFT, 0, exec, $wsaction movetoworkspace 10

# Move window to workspace group #
bind = $kbMoveWinToWsGroup, 1, exec, $wsaction -g movetoworkspace 1
bind = $kbMoveWinToWsGroup, 2, exec, $wsaction -g movetoworkspace 2
bind = $kbMoveWinToWsGroup, 3, exec, $wsaction -g movetoworkspace 3
bind = $kbMoveWinToWsGroup, 4, exec, $wsaction -g movetoworkspace 4
bind = $kbMoveWinToWsGroup, 5, exec, $wsaction -g movetoworkspace 5
bind = $kbMoveWinToWsGroup, 6, exec, $wsaction -g movetoworkspace 6
bind = $kbMoveWinToWsGroup, 7, exec, $wsaction -g movetoworkspace 7
bind = $kbMoveWinToWsGroup, 8, exec, $wsaction -g movetoworkspace 8
bind = $kbMoveWinToWsGroup, 9, exec, $wsaction -g movetoworkspace 9
bind = $kbMoveWinToWsGroup, 0, exec, $wsaction -g movetoworkspace 10

# Move window to workspace -1/+1
binde = Super+Alt, Page_Up, movetoworkspace, -1
binde = Super+Alt, Page_Down, movetoworkspace, +1
#bind = Super+Alt, mouse_down, movetoworkspace, -1
#bind = Super+Alt, mouse_up, movetoworkspace, +1
binde = Ctrl+Super+Shift, right, movetoworkspace, +1
binde = Ctrl+Super+Shift, left, movetoworkspace, -1

# Move window to/from special workspace
#bind = Ctrl+Super+Shift, up, movetoworkspace, special:special
#bind = Ctrl+Super+Shift, down, movetoworkspace, e+0
#bind = Super+Alt, S, movetoworkspace, special:special

# Window groups
binde = $kbWindowGroupCycleNext, cyclenext
binde = $kbWindowGroupCyclePrev, cyclenext, prev
binde = Ctrl+Alt, Tab, changegroupactive, f
binde = Ctrl+Shift+Alt, Tab, changegroupactive, b
bind = $kbToggleGroup, togglegroup
bind = $kbUngroup, moveoutofgroup
bind = Super+Shift, Comma, lockactivegroup, toggle

# Window actions
bind = Super+Shift, left, movefocus, l
bind = Super+Shift, right, movefocus, r
bind = Super+Shift, up, movefocus, u
bind = Super+Shift, down, movefocus, d

bind = Super, left, movewindow, l
bind = Super, right, movewindow, r
bind = Super, up, movewindow, u
bind = Super, down, movewindow, d

binde = Super, Minus, layoutmsg, splitratio -0.1
binde = Super, Equal, layoutmsg, splitratio 0.1

bindm = Super, mouse:272, movewindow
bindm = $kbMoveWindow, movewindow
bindm = Super, mouse:273, resizewindow
bindm = $kbResizeWindow, resizewindow
bind = Ctrl+Super, Backslash, centerwindow, 1
bind = Ctrl+Super+Alt, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+Super+Alt, Backslash, centerwindow, 1
# caelestia resizer pip had no minimal equivalent - removed
# bind = $kbWindowPip, ...
#bind = $kbPinWindow, pin
bind = $kbWindowFullscreen, fullscreen, 0
#bind = $kbWindowBorderedFullscreen, fullscreen, 1  # Fullscreen with borders

bind = Super, V, togglefloating,
bind = Super, Q, killactive,

# Special workspace toggles
#bind = Super, P, exec, caelestia toggle sysmon
bind = Super+Shift, P, exec, spicetify apply
#bind = $kbCommunication, exec, caelestia toggle communication
#bind = $kbTodo, exec, caelestia toggle todo

# Apps
bind = Super, R, exec, firefox


bind = $kbTerminal, exec, app2unit -- $terminal
#bind = $kbBrowser, exec, app2unit -- $browser #Zen browswer
bind = Super, O, exec, app2unit -- $editor # This shit is VSCODE
#bind = Super, G, exec, app2unit -- github-desktop

bind = $kbFileExplorer, exec, app2unit -- $fileExplorer  #Super+E for Thunar
#bind = Super+Alt, E, exec, app2unit -- nemo  #nemo is a nautilus fork (File Manager like Thunar) 
bind = Alt+Shift, Escape, exec, app2unit -- qps  #Task Manager of Linux
bind = Ctrl+Alt, A, exec, app2unit -- pavucontrol  #Audio Manager


# Random wallpaper with rain/circle transition

bind = SUPER, W, exec, awww img "$(find ~/Pictures/Wallpapers -type f | shuf -n1)" --transition-type any


# Utilities
bindl = , Print, exec, grim - | wl-copy  # Full screen capture > clipboard
bind = Super, S, exec, grim -g "$(slurp)" - | swappy -f -  # Capture region
bind = Super+Shift, S, exec, grim -g "$(slurp)" - | wl-copy  # Capture region > clipboard
bind = Super+Shift+Alt, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
bind = Super+Alt, R, exec, wf-recorder -a -f ~/Videos/rec-$(date +%s).mp4  # Record with sound
bind = Ctrl+Alt, R, exec, wf-recorder -f ~/Videos/rec-$(date +%s).mp4  # Record screen
bind = Super+Shift+Alt, R, exec, wf-recorder -g "$(slurp)" -f ~/Videos/rec-$(date +%s).mp4
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker

# Volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = Super+Shift, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# Sleep
bind = Super+Shift, L, exec, systemctl suspend-then-hibernate

# Clipboard and emoji picker
bind = Super, C, exec, pkill fuzzel || cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
#bind = Super, V, exec, pkill fuzzel || caelestia clipboard -d
#bind = Super, V, exec, pkill fuzzel || caelestia emoji -p
bindl = Ctrl+Shift+Alt, V, exec, sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"  # Alternate paste

# Testing
bindl = Super+Shift, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"
